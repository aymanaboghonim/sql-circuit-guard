[project]
name = "sql-circuit-guard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ayman Aboghonim", email = "aymanaboghonim@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gradio>=5.0.0",
    "instructor>=1.15.4",
    "langfuse>=4.14.2",
    "litellm>=1.95.0",
    "pandas>=2.0.0",
    "pydantic>=2.13.4",
    "sqlglot>=30.14.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "playwright>=1.40.0",
    "pre-commit>=4.0.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[project.scripts]
sql-circuit-guard = "sql_circuit_guard:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true
ignore_missing_imports = true
# mypy runs in two environments (project venv + pre-commit isolated hook env)
# whose transitive dependency resolution differs, making "unused-ignore"
# warnings unreliable. Kept off to allow identical results in both.
disable_error_code = ["unused-ignore"]
