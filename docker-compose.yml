services:
  # ----------------------------------------------------------------------------
  # 1. APPLICATION SERVICE (GRADIO UI & CIRCUIT ORCHESTRATOR)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sql-circuit-guard:latest
    container_name: sql_circuit_guard_app
    ports:
      - "7860:7860"
    environment:
      - OLLAMA_API_BASE=http://ollama:11434
      - LOCAL_MODEL_NAME=ollama/ibm/granite4.1:8b
      - CLOUD_MODEL_NAME=gemini/gemini-3.1-flash-lite
      - ENABLE_CLOUD_FALLBACK=true
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-local-demo-key}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-local-demo-key}
      - LANGFUSE_HOST=http://langfuse-server:3000
    env_file:
      - .env
    depends_on:
      - ollama
      - langfuse-server
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 2. LOCAL LLM INFERENCE SERVER (OLLAMA WITH RTX 3070 GPU SUPPORT)
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: sql_circuit_guard_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 3. OBSERVABILITY BACKEND (LANGFUSE SERVER & POSTGRES DATABASE)
  # ----------------------------------------------------------------------------
  langfuse-server:
    image: langfuse/langfuse:2
    container_name: sql_circuit_guard_langfuse
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - NEXTAUTH_SECRET=mysecret-local-development-only
      - SALT=mysecret-local-development-only
      - NEXTAUTH_URL=http://localhost:3000
      - TELEMETRY_ENABLED=false
    depends_on:
      langfuse-db:
        condition: service_healthy
    restart: unless-stopped

  langfuse-db:
    image: postgres:16-alpine
    container_name: sql_circuit_guard_postgres
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
      - POSTGRES_DB=langfuse
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  ollama_storage:
  pg_data:
